window_days: 8
exa:
  num_results: 20
  max_characters: 2000
  media_domains:
    - yicai.com
    - 21jingji.com
    - eeo.com.cn
    - jiemian.com
    - thepaper.cn
    - stcn.com
    - cs.com.cn
    - cnstock.com
    - nbd.com.cn
    - cls.cn
    - bjnews.com.cn
    - caixin.com
    - 36kr.com
    - huxiu.com
    - tmtpost.com
    - luxe.co
    - d1cm.com
    - hea.cn
    - gasgoo.com
    - chinanews.com.cn
    - xinhuanet.com
    - people.com.cn
    - time-weekly.com
    - lanjinger.com
    - ce.cn
    - cnr.cn
    - iyiou.com
    - leiphone.com
    - geekpark.net
    - ithome.com
    - infzm.com
    - chinaventure.com.cn
    - guancha.cn
  queries:                # {zh} and {en} are substituted; {en} may be empty
    综合媒体:
      template: "{zh} 最新动态"
      scope: media
    综合开放:
      template: "{zh} {en} 本周 新闻"
      scope: open
    数字化运营:
      template: "{zh} 数字化 智能制造 供应链 IT系统 合作 签约"
      scope: open
    战略竞争:
      template: "{zh} 战略 组织调整 管理层 竞争 海外"
      scope: open
industries:
  家电:
    exa: "中国家电行业 竞争 美的 格力 海信 小米 以旧换新 出海"
  显示面板:
    exa: "显示面板行业 京东方 OLED LCD 价格 产能"
  光伏:
    exa: "光伏硅片行业 价格 产能 反内卷"
  运动鞋服:
    exa: "中国运动鞋服行业 耐克 阿迪达斯 特步 361度 竞争 零售"
  工程机械:
    exa: "工程机械行业 挖掘机 销量 出口 三一 中联 卡特彼勒"
  新能源车:
    exa: "中国新能源汽车行业 价格战 出海 吉利 特斯拉 零跑 销量"
filings:
  bodies_max: 10
  body_chars: 2500
  routine_patterns:
    - 翌日披露报表
    - 股份变动
    - 簿记建档
    - 票面利率
    - 更名公告
    - 法律意见书
    - 核查意见
    - 通知债权人
    - 董事会会议召开日期
    - 月报表
    - 信用评级
    - 募集说明书
    - 发行公告
    - 海外监管公告
    - 持续督导
    - 会议资料
    - 独立董事.*意见
low_value_patterns:
  - FAQ
  - 哪个好
  - 怎么选
  - 值得买
  - 攻略
  - 选购
  - 避坑
  - 闭眼
  - 测评
  - 评测
  - 口碑
  - 优惠券
  - 领券
  - 股价行情
  - 股票股价
  - 融资余额
  - 融资净(买入|偿还)
  - 主力资金
  - 龙虎榜
  - 期货
  - 热招
  - 校招
  - 招聘
farm_page_patterns:
  - Powered by Discuz
  - 企业配套与项目交付服务
  - 求购
  - 找合伙人
blocked_domains:
  - pswp.cn
  - hotelren.com
  - proginn.com
  - ukezhitan.com
  - haianrx.com
  - facaicao.com
  - tfxinteractiva.com
  - reuterd.com
  - epochtimes.com
  - ntdtv.com
source_tiers:             # matched case-insensitively as substring of outlet name or host; first match wins
  主流媒体: [新华, 人民网, 央视, 中新网, chinanews, 财新, 第一财经, yicai, 21世纪, 21jingji, 经济观察, eeo.com.cn, 界面, jiemian, 澎湃, thepaper, 证券时报, stcn, 中国证券报, cs.com.cn, 上海证券报, 每日经济, nbd.com.cn, 财联社, cls.cn, 新京报, Reuters, Bloomberg, Financial Times, ft.com, WSJ, CNBC, SCMP, scmp.com, Nikkei, 信报, hkej]
  行业媒体: [第一工程机械, d1cm, 家电网, hea.cn, 华丽志, luxe.co, 懒熊, 盖世汽车, gasgoo, 汽车之家, 电子工程专辑, eet-china, e-works, CnEVPost, cnevpost, DIGITIMES, 中国商用汽车网, 集邦, trendforce, ofweek, 6300.net, 工程机械]
  门户与自媒体: [新浪, sina, 搜狐, sohu, 网易, 163.com, 腾讯, qq.com, 凤凰, ifeng, 东方财富, eastmoney, 财富号, 雪球, xueqiu, 百家号, 同花顺, 10jqka, 富途, futunn]
material:
  filings_max: 10
  bodies_max: 15
  body_chars: 1800
  industry_bodies_max: 3
classify:
  batch_size: 40
  screen_model: anthropic/claude-haiku-5.5
  review_model: openai/gpt-6-luna
  reasoning_effort: low
synth:
  draft_model: anthropic/claude-haiku-5.5
  check_model: openai/gpt-6-luna
  draft_effort: medium     # Haiku draft; reasoning tokens were >80% of output at high
  check_effort: medium     # Luna fact check
  revise_effort: low       # sentence-level edits only
  retry_effort: low        # one retry when the draft hits max_tokens
  max_tokens: 16000
  last_week_chars: 3000
